版本: core-v1
核心模块:
  反推价计算:
    启用: true
    说明: 根据历史前复权收盘价反推目标RSI对应价格
  哨兵价形成:
    启用: true
    说明: 分别保存RSI反推价和上一根最高价
  哨兵价突破成交:
    启用: true
    说明: 本根同时达到RSI反推价且严格突破上一根最高价后执行买入
  哨兵价突破后上移:
    启用: true
    说明: 价格突破但未成交时允许哨兵价跟随上移
  本根形成立即成交:
    启用: true
    说明: 本根哨兵价形成后，使用本根最高价立即检查成交
  下一根执行:
    启用: false
    说明: 使用事先已计算的反推价和前高边界，由本根价格触发
回退说明:
- 关闭哨兵价突破后上移，可恢复固定哨兵价实验
- 关闭反推价计算或哨兵价形成，核心买入链路将停止
