# 过滤因子配置 — 买入前过滤，所有因子通过才能买入
# 每个因子独立开关，按检查顺序执行
# 要新增因子 → 在8_过滤因子/下加文件，这里加配置项

过滤因子列表:

  - 名称: "个股大周期趋势准入"
    英文标识: stock_trend_universe_filter
    启用: false
    检查顺序: 0
    短均线周期: 20
    中均线周期: 60
    长均线周期: 120
    长均线斜率周期: 20
    长均线下偏离上限: 0.10
    短中均线偏离上限: 0.05
    长均线斜率下限: -0.02
    中期高点回撤上限: 0.25
    分级风险模式: false
    极端长均线下偏离上限: 0.20
    极端中期回撤上限: 0.45
    极端斜率下限: -0.05
    风险状态允许信号: ["RSI上穿20"]
    历史不足时放行: false
    说明: "个股大周期走坏时禁止新开仓；已有持仓不强制平仓"

  - 名称: "RSI多信号共振"
    英文标识: rsi_resonance_filter
    启用: false
    检查顺序: 1
    KDJ周期: 9
    成交量均线周期: 20
    最少通过数量: 2
    要求成交量确认: true
    最低量比: 1.0
    历史不足时放行: false
    说明: "RSI信号需与MACD、KDJ、成交量至少两项共振；指标使用已完成K线"

  - 名称: "RSI市场状态自适应"
    英文标识: rsi_regime_adaptive_filter
    启用: false
    检查顺序: 1
    短均线周期: 20
    长均线周期: 60
    牛市允许信号: ["RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    震荡市允许信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线"]
    熊市允许信号: ["RSI上穿20", "RSI上穿30"]
    历史不足时放行: false
    阈值模式: "fixed"                    # fixed=保持原阈值，adaptive=按市场状态调整
    状态阈值:
      牛市: {RSI上穿20: 25, RSI上穿30: 35, RSI上穿70: 75, RSI上穿80: 80}
      震荡市: {RSI上穿20: 20, RSI上穿30: 30, RSI上穿70: 70, RSI上穿80: 80}
      熊市: {RSI上穿20: 15, RSI上穿30: 25, RSI上穿70: 80, RSI上穿80: 80}
    说明: "按短中期趋势调整允许的RSI信号；只影响新开仓和网格确认"

  - 名称: "基本面股票池准入"
    英文标识: fundamental_universe_filter
    启用: false
    检查顺序: 0
    历史数据文件: "数据模块/基本面历史快照_2020_2026.csv"
    PE相对行业倍数: 0.80
    ROE下限: 0.15
    近3年净利CAGR下限: 0.20
    资产负债率上限: 0.50
    经营现金流净利润比下限: 0.80
    行业景气指数下限: 0.0
    说明: "仅使用生效日期不晚于交易日的基本面快照；缺失数据时拦截"

  - 名称: "基本面评分准入"
    英文标识: fundamental_score_filter
    启用: false
    检查顺序: 0
    个股评分文件: "基本面/个股历史评分结果.csv"
    最低总分: 65
    最低置信度: 0.25
    说明: "只使用交易日前已经生成的个股评分；仅限制首次开仓，已有持仓、卖出和网格不受影响"

  - 名称: "行业景气历史准入"
    英文标识: industry_boom_filter
    启用: false
    检查顺序: 0
    历史行业归属文件: "基本面/历史数据/股票行业归属历史.csv"
    历史行业评分文件: "基本面/历史数据/行业景气评分历史.csv"
    行业景气指数下限: 6.0
    说明: "只使用交易日已生效的行业归属与评分；缺失时禁止新开仓，已有持仓不强平"

  - 名称: "个股基本面与行业景气联合准入"
    英文标识: fundamental_industry_combo_filter
    启用: false
    检查顺序: 0
    个股评分文件: "基本面/个股历史评分结果.csv"
    行业评分文件: "基本面/历史数据/行业景气评分历史.csv"
    行业归属文件: "基本面/历史数据/股票行业归属历史.csv"
    个股权重: 0.60
    行业权重: 0.40
    综合准入分数: 75
    最低置信度: 0.80
    说明: "个股质量与行业景气共同决定新开仓；已有持仓不强平"

  - 名称: "沪深300长期趋势过滤"
    英文标识: index_trend_filter
    启用: false                        # 滚动训练结构实验，正式配置暂不启用
    检查顺序: 0
    均线周期: 120
    历史不足时放行: true
    说明: "只使用前一交易日指数收盘；指数站上长期均线才允许开仓"

  - 名称: "上一交易日成交额确认"
    英文标识: volume_spike_filter
    启用: false                        # 亏损归因候选，正式配置暂不启用
    检查顺序: 0
    最低成交额比率: 0.70               # 上一交易日成交额 / 前20日平均成交额
    适用信号: []                       # 空列表=全部信号，也可只填RSI上穿30等
    历史不足时放行: true
    说明: "只使用上一完整交易日数据；成交不足时拦截哨兵价突破买入"

  - 名称: "沪深300市场状态过滤"
    英文标识: market_regime_filter
    启用: false                        # 第一阶段单股训练验证，正式关闭
    检查顺序: 0
    高波动比率: 1.5
    防守模式允许信号: ["RSI上穿20"]
    收缩模式允许信号: ["RSI上穿20"]
    进攻禁止信号: []
    震荡禁止信号: []
    历史不足时放行: true
    说明: "只用前一交易日HS300状态；防守/收缩期只允许RSI上穿20"

  - 名称: "波动率状态过滤"
    英文标识: volatility_regime_filter
    启用: false                        # 第一阶段训练期单因子验证，正式关闭
    检查顺序: 1
    计算周期: 20
    高波动阈值: 0.03
    低波动阈值: 0.015
    高波动允许信号: ["RSI上穿20"]
    中波动禁止信号: []
    低波动禁止信号: []
    历史不足时放行: true
    说明: "只用前一交易日完成数据；高波动环境只允许RSI上穿20"

  - 名称: "IC复合扩展因子"
    英文标识: alpha_composite_filter
    启用: false                        # 全市场验证收益下降，暂不正式启用
    检查顺序: 0
    模型文件: "1_策略配置/扩展因子模型.json"
    得分阈值: 0.0
    历史不足时放行: true
    说明: "仅使用2020-2023训练锁定的前5复合因子；前一交易日得分>0才允许买入"

  - 名称: "MA方向过滤"
    英文标识: ma_direction_filter
    启用: false
    检查顺序: 2
    过滤模式: "斜率拦截"               # 二元方向 / 斜率拦截
    斜率下阈值: -999                     # 过滤模式=斜率拦截时生效，低于此值拦截（大幅下跌）
    斜率上阈值: 999                      # 过滤模式=斜率拦截时生效，高于此值拦截（大幅追涨）
    禁止方向: "上升"                   # 过滤模式=二元方向时生效：上升=MA涨时禁买，下降=MA跌时禁买
    MA对比K线数: 5                      # 对比前N根K线的MA，计算斜率
    说明: "斜率拦截：MA<-1.5不接飞刀，MA>+1.5不追涨；二元方向：MA方向禁买"
  - 名称: "RSI背离过滤"
    英文标识: divergence_filter
    启用: false
    检查顺序: 0                       # 最高优先级，优先于MA方向过滤
    顶背离拦截: true                   # 顶背离时暂停买入
    说明: "RSI背离检测：顶背离暂停买入，底背离加强信号"

  - 名称: "RSI_MA假信号过滤"
    英文标识: rsi_ma_filter
    启用: true                         # 候选正式参数：RSI_MA前3根
    检查顺序: 1                       # 优先于MA方向过滤
    检查K线数: 3                       # 对比前N根MA（当前MA突破则拦截）
    说明: "仅过滤RSI上穿均线信号，MA突破前N根最高时暂缓买入"


  - 名称: "信号质量分过滤"
    英文标识: quality_score_filter
    启用: false
    检查顺序: 2
    最低质量分: 0.3                    # 低于此值不买
    说明: "质量分太低不买"

  - 名称: "连续亏损过滤"
    英文标识: consecutive_loss_filter
    启用: false                        # 暂关闭，观察数据
    检查顺序: 3
    连续亏损上限: 3                     # 连续亏3次暂停
    冷却K线数: 10                       # 暂停10根K线
    说明: "连续亏损N次后暂停M根K线"

  - 名称: "RSI位置过滤"
    英文标识: rsi_position_filter
    启用: false                        # 实验结束，正式基线保持关闭
    检查顺序: 4
    最高RSI: 70                         # RSI超过此值不买
    说明: "RSI太高不买，避免追涨"

  - 名称: "RSI中性区过滤"
    英文标识: rsi_neutral_zone_filter
    启用: false
    检查顺序: 5
    中性下限: 42
    中性上限: 58
    适用信号: []
    历史不足时放行: true
    说明: "RSI落在42~58中性区时不交易"

  - 名称: "RSI区间对齐过滤"
    英文标识: rsi_band_alignment_filter
    启用: false
    检查顺序: 6
    中性下限: 42
    中性上限: 58
    低位信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线"]
    高位信号: ["RSI上穿70", "RSI上穿80"]
    适用信号: []
    历史不足时放行: true
    说明: "低位信号只在低区间放行，高位信号只在高区间放行"

  - 名称: "哨兵价量价确认"
    英文标识: sentinel_volume_price_filter
    启用: false
    检查顺序: 7
    运行模式: "只记录"
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    启用项:
      缩量回撤衰竭: false
      量价转强确认: false
      放量趋势确认: false
      收盘承接强度: false
      上影抛压过滤: false
      异常放量下跌过滤: false
    回看根数: 8
    缩量比例上限: 0.85
    近期价格涨幅下限: 0.0
    趋势涨幅下限: 0.0
    相对量能下限: 1.10
    最低收盘强度: 0.60
    最大上影比例: 0.35
    异常跌幅阈值: -0.02
    异常量能阈值: 1.50
    异常收盘强度上限: 0.35
    说明: "旧版聚合量价确认，仅用于兼容历史快照；请改用下方独立交易拦截因子"

  - 名称: "缩量回撤衰竭"
    英文标识: sentinel_volume_dryup_filter
    启用: false
    检查顺序: 7
    组合组: sentinel_entry_structure
    组合逻辑: 任一通过
    组合说明: "入场结构确认：已启用项至少满足一个"
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    缩量比例上限: 0.85
    说明: "哨兵形成前价格回撤且量能收缩，未满足时正式拦截买入与网格加仓"

  - 名称: "量价转强确认"
    英文标识: sentinel_volume_price_strength_filter
    启用: false
    检查顺序: 8
    组合组: sentinel_entry_structure
    组合逻辑: 任一通过
    组合说明: "入场结构确认：已启用项至少满足一个"
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    近期价格涨幅下限: 0.0
    相对量能下限: 1.10
    说明: "哨兵形成前价格转强且相对量能达标，未满足时正式拦截买入与网格加仓"

  - 名称: "放量趋势确认"
    英文标识: sentinel_volume_trend_filter
    启用: false
    检查顺序: 9
    组合组: sentinel_entry_structure
    组合逻辑: 任一通过
    组合说明: "入场结构确认：已启用项至少满足一个"
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    趋势涨幅下限: 0.0
    相对量能下限: 1.10
    说明: "哨兵形成前趋势上涨且量能确认，未满足时正式拦截买入与网格加仓"

  - 名称: "收盘承接强度"
    英文标识: sentinel_close_strength_filter
    启用: false
    检查顺序: 10
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    最低收盘强度: 0.60
    说明: "哨兵形成K线收盘位置不足时正式拦截买入与网格加仓"

  - 名称: "上影抛压过滤"
    英文标识: sentinel_upper_shadow_filter
    启用: false
    检查顺序: 11
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    最大上影比例: 0.35
    说明: "哨兵形成K线上影抛压过大时正式拦截买入与网格加仓"

  - 名称: "异常放量下跌过滤"
    英文标识: sentinel_volume_drop_filter
    启用: false
    检查顺序: 12
    适用信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线", "RSI上穿70"]
    历史不足时放行: true
    异常跌幅阈值: -0.02
    异常量能阈值: 1.50
    异常收盘强度上限: 0.35
    说明: "出现放量下跌且收盘疲弱时正式拦截买入与网格加仓"
