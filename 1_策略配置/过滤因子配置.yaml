# 过滤因子配置 — 买入前过滤，所有因子通过才能买入
# 每个因子独立开关，按检查顺序执行
# 要新增因子 → 在8_过滤因子/下加文件，这里加配置项

过滤因子列表:

  - 名称: "沪深300长期趋势过滤"
    英文标识: index_trend_filter
    启用: false                        # 滚动训练结构实验，正式配置暂不启用
    检查顺序: 0
    均线周期: 120
    历史不足时放行: true
    说明: "只使用前一交易日指数收盘；指数站上长期均线才允许开仓"

  - 名称: "上一交易日成交额确认"
    英文标识: volume_spike_filter
    启用: false                        # 亏损归因候选，正式配置暂不启用
    检查顺序: 0
    最低成交额比率: 0.70               # 上一交易日成交额 / 前20日平均成交额
    适用信号: []                       # 空列表=全部信号，也可只填RSI上穿30等
    历史不足时放行: true
    说明: "只使用上一完整交易日数据；成交不足时拦截哨兵价突破买入"

  - 名称: "沪深300市场状态过滤"
    英文标识: market_regime_filter
    启用: false                        # 第一阶段单股训练验证，正式关闭
    检查顺序: 0
    高波动比率: 1.5
    防守模式允许信号: ["RSI上穿20"]
    收缩模式允许信号: ["RSI上穿20"]
    进攻禁止信号: []
    震荡禁止信号: []
    历史不足时放行: true
    说明: "只用前一交易日HS300状态；防守/收缩期只允许RSI上穿20"

  - 名称: "波动率状态过滤"
    英文标识: volatility_regime_filter
    启用: false                        # 第一阶段训练期单因子验证，正式关闭
    检查顺序: 1
    计算周期: 20
    高波动阈值: 0.03
    低波动阈值: 0.015
    高波动允许信号: ["RSI上穿20"]
    中波动禁止信号: []
    低波动禁止信号: []
    历史不足时放行: true
    说明: "只用前一交易日完成数据；高波动环境只允许RSI上穿20"

  - 名称: "IC复合扩展因子"
    英文标识: alpha_composite_filter
    启用: false                        # 全市场验证收益下降，暂不正式启用
    检查顺序: 0
    模型文件: "1_策略配置/扩展因子模型.json"
    得分阈值: 0.0
    历史不足时放行: true
    说明: "仅使用2020-2023训练锁定的前5复合因子；前一交易日得分>0才允许买入"

  - 名称: "MA方向过滤"
    英文标识: ma_direction_filter
    启用: false
    检查顺序: 2
    过滤模式: "斜率拦截"               # 二元方向 / 斜率拦截
    斜率下阈值: -999                     # 过滤模式=斜率拦截时生效，低于此值拦截（大幅下跌）
    斜率上阈值: 999                      # 过滤模式=斜率拦截时生效，高于此值拦截（大幅追涨）
    禁止方向: "上升"                   # 过滤模式=二元方向时生效：上升=MA涨时禁买，下降=MA跌时禁买
    MA对比K线数: 5                      # 对比前N根K线的MA，计算斜率
    说明: "斜率拦截：MA<-1.5不接飞刀，MA>+1.5不追涨；二元方向：MA方向禁买"
  - 名称: "RSI背离过滤"
    英文标识: divergence_filter
    启用: false
    检查顺序: 0                       # 最高优先级，优先于MA方向过滤
    顶背离拦截: true                   # 顶背离时暂停买入
    说明: "RSI背离检测：顶背离暂停买入，底背离加强信号"

  - 名称: "RSI_MA假信号过滤"
    英文标识: rsi_ma_filter
    启用: true                         # 候选正式参数：RSI_MA前3根
    检查顺序: 1                       # 优先于MA方向过滤
    检查K线数: 3                       # 对比前N根MA（当前MA突破则拦截）
    说明: "仅过滤RSI上穿均线信号，MA突破前N根最高时暂缓买入"


  - 名称: "信号质量分过滤"
    英文标识: quality_score_filter
    启用: false
    检查顺序: 2
    最低质量分: 0.3                    # 低于此值不买
    说明: "质量分太低不买"

  - 名称: "连续亏损过滤"
    英文标识: consecutive_loss_filter
    启用: false                        # 暂关闭，观察数据
    检查顺序: 3
    连续亏损上限: 3                     # 连续亏3次暂停
    冷却K线数: 10                       # 暂停10根K线
    说明: "连续亏损N次后暂停M根K线"

  - 名称: "RSI位置过滤"
    英文标识: rsi_position_filter
    启用: false                        # 实验结束，正式基线保持关闭
    检查顺序: 4
    最高RSI: 70                         # RSI超过此值不买
    说明: "RSI太高不买，避免追涨"

  - 名称: "RSI中性区过滤"
    英文标识: rsi_neutral_zone_filter
    启用: false
    检查顺序: 5
    中性下限: 42
    中性上限: 58
    适用信号: []
    历史不足时放行: true
    说明: "RSI落在42~58中性区时不交易"

  - 名称: "RSI区间对齐过滤"
    英文标识: rsi_band_alignment_filter
    启用: false
    检查顺序: 6
    中性下限: 42
    中性上限: 58
    低位信号: ["RSI上穿20", "RSI上穿30", "RSI上穿均线"]
    高位信号: ["RSI上穿70", "RSI上穿80"]
    适用信号: []
    历史不足时放行: true
    说明: "低位信号只在低区间放行，高位信号只在高区间放行"
