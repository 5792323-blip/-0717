# 买入信号配置 — 所有买入条件在这里控制
# 改数字 = 改策略，不用改代码
# 
# [-]=暂时关闭，用来调试    [x]=启用    [ ]=未完成

买入信号列表:

  - 名称: "RSI上穿20"
    英文标识: rsi_cross_20
    启用: true                          # ✅ 优先调试这个
    优先级: 0                           # 0=最高，数字越小越优先
    基础质量分: 1.0                      # 满分信号
    单笔买入上限: 200000                  # 最多10万
    说明: "极端超卖反弹，RSI从20以下上穿到20以上"

  - 名称: "RSI上穿30"
    英文标识: rsi_cross_30
    启用: true                           # 全部打开，只看哨兵价突破
    优先级: 1
    基础质量分: 1.0
    单笔买入上限: 200000
    说明: "超卖反弹，RSI从30以下上穿到30以上"

  - 名称: "RSI上穿均线"
    英文标识: rsi_cross_ma
    启用: true                          # [x] 已启用
    优先级: 2
    基础质量分: 1.0
    单笔买入上限: 200000
    需要均线上涨确认: true               # MA(current) > 前N根最高值
    确认K线数: 0                         # 看过去5根MA
    说明: "RSI上穿RSI_MA，需确认均线趋势向上"

  - 名称: "RSI上穿70"
    英文标识: rsi_cross_70
    启用: true                           # 全部打开，只看哨兵价突破
    优先级: 3
    基础质量分: 1.0
    单笔买入上限: 200000
    说明: "超买追涨，RSI从70以下上穿到70以上"

共通设置:
  RSI上穿检测: "当前RSI > 阈值 且 上一根RSI <= 阈值"
