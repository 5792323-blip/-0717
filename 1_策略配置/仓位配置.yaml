# 仓位配置 — 每笔交易买多少在这里控制
# 仓位 = 基准 × 信号质量 × 大盘系数 × 波动率调整
#
# [-]=暂时关闭    [x]=启用    [ ]=未完成

基准仓位:
  初始资金: 20000000                    # 2000万
  基础单只金额: 200000                   # 每只基础20万
  最大单只比例: 0.10                    # 不超过总资金10%
  最大总持仓数: 200                      # 最多同时持有200只
  最大总仓位比例: 0.98                  # 总仓位不超过98%
  现金底线: 0.20                        # 永远留20%现金

信号质量调整:
  # 按信号类型调整仓位比例
  RSI上穿20: 1.0                        # 最好的信号，满配
  RSI上穿30: 0.7
  RSI上穿均线: 0.4
  RSI上穿70: 0.2                        # 最弱信号，意思一下

大盘系数调整:
  # 大盘状态不同，整体仓位不同
  进攻模式系数: 1.0                     # 大盘好，满仓做
  震荡模式系数: 0.5                     # 大盘震荡，半仓
  防守模式系数: 0.2                     # 大盘差，轻仓保命
  收缩模式系数: 0.3                     # 高波动，降低仓位

  进攻模式条件:
    大盘在120日均线上方: true
    大盘20日线向上: true

  防守模式条件:
    大盘在120日均线下方: true
    大盘20日线向下: true

  收缩模式条件:
    市场平均ATR > 前20日ATR × 1.5

波动率调整:
  高波动阈值: 0.40                      # 年化波动率 > 40%
  高波动折扣: 0.7                       # 仓位打7折
  低波动阈值: 0.20                      # 年化波动率 < 20%
  低波动加成: 1.2                       # 仓位加1.2倍

行业控制:
  单行业上限: 0.30                      # 同一行业不超过30%
  启用: false                           # [-] 单股调试暂不需要
