# 卖出规则配置 — 所有卖出条件在这里控制
# 每根K线按顺序检查，任一触发就执行
# 
# [-]=暂时关闭    [x]=启用    [ ]=未完成

卖出条件列表:

  - 名称: "无效交易退出"
    英文标识: stagnation_exit
    启用: false                         # MFE/MAE训练候选，正式配置暂不启用
    检查顺序: 1
    检查K线数: 4                       # 约1个交易日后检查
    最低MFE: 0.005                      # 最大浮盈不足0.5%
    说明: "持仓早期未产生最低浮盈且仍亏损时，下一根可交易K线开盘退出"

  - 名称: "分批止盈"
    英文标识: take_profit
    启用: false                         # [-] 暂屏蔽
    检查顺序: 1                          # 第一个检查
    第一目标: 0.05                       # 赚 5% 卖 1/3
    第二目标: 0.10                       # 赚 10% 再卖 1/3
    第三目标: 0.20                       # 赚 20% 全清
    说明: "盈利时主动锁定利润"

  - 名称: "盈利8%平仓"
    英文标识: profit_8_exit
    启用: false
    检查顺序: 2
    盈利阈值: 0.08
    说明: "持仓盈利达到8%以上时全仓平仓"

  - 名称: "TB最低价RSI下穿卖出"
    英文标识: tb_rsi_low_exit
    启用: false
    检查顺序: 2
    下穿阈值: [70, 30, 20]
    说明: "TB复刻对照：使用最低价RSI下穿阈值触发全仓卖出"

  - 名称: "硬止损"
    英文标识: stop_loss
    启用: false                         # [-] 暂屏蔽
    检查顺序: 2                          # 第二个检查
    止损倍数: 3                          # 亏损 > 3 × ATR 就卖
    说明: "亏损到一定程度立刻砍，不犹豫"

  - 名称: "RSI站岗价止损"
    英文标识: rsi_guard
    启用: false
    检查顺序: 3
    RSI下穿阈值: [80, 70]
    RSI下穿均线下限: 50
    ATR缓冲倍数: 0.5
    说明: "RSI从高位下穿时设站岗价，跌破卖出"

  - 名称: "RSI阈值守仓"
    英文标识: rsi_threshold_hold
    启用: false
    检查顺序: 0
    暂缓卖出规则: [atr_trailing, atr_take_profit]
    说明: "RSI上穿20、30、均线、70或80后，未下穿最近关卡前暂缓两类ATR跟踪退出"

  - 名称: "ATR跟踪止盈止损"
    英文标识: atr_trailing
    启用: true                          # [x] 已启用
    检查顺序: 5
    ATR倍数: 2.5                       # 价格从最高点回落2.5倍ATR时卖出
    MA调整倍率: 50                      # MA下降时ATR倍数放大, 越大调整越小(50=5%幅度)
    下限比例: 0.6                       # MA上升时ATR倍数最低缩到60%
    说明: "MA下降幅度大ATR变宽(防震), MA上升ATR变紧(锁利)"

  - 名称: "ATR跟踪止盈（仅盈利触发）"
    英文标识: atr_take_profit
    启用: false
    检查顺序: 5
    ATR倍数: 2.5
    启动盈利比例: 0.0
    MA调整倍率: 50
    下限比例: 0.6
    说明: "仅当净盈亏超过启动比例后，按最高价-ATR倍数×ATR跟踪止盈；浮亏不触发"

  - 名称: "动能衰竭退出"
    英文标识: momentum_exit
    启用: false                          # [x] 已启用
    检查顺序: 4
    基础回落阈值: 25                    # RSI从峰值回落25点
    ATR调整: true                       # 用ATR动态调整：阈值 × (股票ATR/平均ATR)
    说明: "RSI涨到69.9上不去，开始走弱时退出"

  - 名称: "时间退出"
    英文标识: time_exit
    启用: false                          # [x] 已启用
    检查顺序: 5
    最大持仓K线数: 80                   # 约20个交易日
    亏损触发: -0.08                     # 亏损超过8%才触发
    说明: "拿了太久还不赚钱，清仓换别的"

  - 名称: "背离修正卖出"
    英文标识: divergence_fix
    启用: false                         # [-] 暂屏蔽
    检查顺序: 6
    底背离暂缓K线数: 3                  # 出现底背离，暂缓卖出3根K线
    顶背离加速: true                    # 出现顶背离，加速卖出
    说明: "底背离时暂缓卖，顶背离时加速卖"
