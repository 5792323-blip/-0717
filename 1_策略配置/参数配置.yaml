# 参数配置 — 所有数值参数集中在这里
# 改数字 = 改策略

技术指标参数:
  RSI周期: 14
  RSI均线周期: 20
  RSI价格源: close                    # high=最高价, close=收盘价, low=最低价
  ATR周期: 14
  信号过期K线数: 72                    # 已屏蔽，旧哨兵价不按K线数自动释放
  哨兵价本根形成立即买入: true       # true=形成当根买入；false=只等后续K线突破

交易成本:
  滑点: 0.001                           # 千分之一
  佣金: 0.00025                         # 万分之二点五
  印花税: 0.001                         # 千分之一（卖出时收）
  过户费: 0.00001                       # 万分之零点一（买卖均收）
  买入溢价: 1.001                       # 买入价 = BFQ收盘 × 1.001

买入参数:
  买入时机模式: precomputed_stop_entry   # 严格预挂单 / 收盘确认次开 / 旧版对照
  涨停不买: true                        # 涨停时禁止买入
  涨跌停比例: 0.10                       # 默认主板10%；20%股票可改为0.20
  RSI买入上限: 75                       # RSI > 75 禁止买入
  现金紧张线: 0.05                      # 现金 < 5% 只买 cross_70
  现金适中线: 0.15                      # 现金 < 15% 只买 cross_30 和 cross_70

卖出参数:
  分批止盈第一档: 0.05                  # 赚5%卖1/3
  分批止盈第二档: 0.10                  # 赚10%卖1/3
  分批止盈第三档: 0.20                  # 赚20%全清
  硬止损倍数: 3                         # 3 × ATR
  站岗价ATR缓冲: 0.5                    # 站岗价 - 0.5×ATR
  动能衰竭基础阈值: 25                  # RSI从峰值回落25点
  时间退出K线数: 80                     # 持仓80根K线
  时间退出亏损线: -0.08                 # 亏损超过8%触发

仓位参数:
  初始资金: 20000000
  基础单只金额: 200000
  最大单只比例: 0.50
  最大持仓数: 200
  最大总仓位: 0.98
  现金底线: 0.20

背离参数:
  顶背离检查K线数: 60                   # 看过去60根K线
  底背离检查K线数: 60
  底背离暂缓卖出: 3                     # 出现底背离暂缓3根K线

大盘状态参数:
  均线周期: 120                         # 120日均线
  短均线周期: 20                        # 20日均线
  收缩模式ATR倍数: 1.5                  # 平均ATR > 前20日×1.5
