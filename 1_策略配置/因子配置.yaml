全局因子开关: true
因子列表:
  market_state:
    启用: false
    说明: 大盘状态分类器 — 进攻/震荡/防守/收缩
    参数:
      进攻阈值: 1.5
      防守阈值: -1.5
  rsi_ma_filter:
    启用: false
    说明: RSI_MA假信号过滤 — 仅过滤RSI上穿均线
    参数:
      前看K线数: 5
  divergence:
    启用: false
    说明: RSI背离检测 — 顶背离暂停买，底背离加强买
    参数:
      前看K线数: 20
  ma_direction:
    启用: false
    说明: MA方向过滤 — 斜率拦截追涨/抗跌
    参数:
      下跌拦截阈值: -0.5
      上涨拦截阈值: 0.5
  entry_timing:
    启用: false
    说明: K线动量入场 — 根据K线实体/ATR决定入场方式
    参数:
      大阳线阈值: 0.7
      中阳线阈值: 0.3
  signal_scorer:
    启用: false
    说明: 信号质量评分 — 综合信号类型+大盘+背离
    参数:
      基础分_上穿20: 0.7
      基础分_上穿30: 0.5
      基础分_上穿均线: 0.6
      基础分_上穿70: 0.4
  momentum_exit:
    启用: false
    说明: 动能衰竭退出 — RSI从峰值回落>阈值卖出
    参数:
      RSI回落阈值: 15
      最低衰减: 5
  take_profit:
    启用: false
    说明: 分批止盈 — 5%卖1/3, 10%卖1/3, 20%全清
    参数:
      第一档: 0.05
      第一档比例: 0.33
      第二档: 0.1
      第二档比例: 0.33
      第三档: 0.2
      第三档比例: 1.0
  position_sizing:
    启用: false
    说明: 凯利仓位计算 — 信号质量×大盘系数×波动率
    参数:
      基准金额: 200000
      最大比例: 0.1
  total_control:
    启用: false
    说明: 总仓位控制 — 大盘状态控制总仓位上限
    参数:
      进攻模式: 0.98
      震荡模式: 0.5
      防守模式: 0.2
      收缩模式: 0.3
  grid_addon:
    启用: false
    说明: 网格加仓 — 回撤触发逐级加倍加仓（最多N次，不含首次开仓）
    参数:
      最大加仓次数: 5
      首次回撤阈值: 0.05
      允许同根多次加仓: false
  xgboost_trend:
    启用: false
    说明: XGBoost趋势判断 (Phase 3) — 需训练数据
    参数: {}
  randomforest_market:
    启用: false
    说明: RandomForest大盘环境 (Phase 3) — 需训练数据
    参数: {}
  committee_vote:
    启用: false
    说明: 委员会投票机制 (Phase 3) — 需ML模型就绪
    参数:
      投票阈值: 0.5
  ml_entry_timing:
    启用: false
    说明: ML入场时机 (Phase 3) — 需ML模型就绪
    参数: {}
  ml_fake_drop:
    启用: false
    说明: ML假跌判断 (Phase 3) — 需ML模型就绪
    参数: {}
  波动率分类器:
    启用: false
    说明: 波动率分类器—收益率标准差法,动态调整MA拦截阈值
    参数:
      高波动阈值: 0.03
      低波动阈值: 0.015
      计算周期: 20
      阈值映射:
        高波动:
          下跌拦截: -1.0
          上涨拦截: 1.0
        中波动:
          下跌拦截: -0.5
          上涨拦截: 0.5
        低波动:
          下跌拦截: -0.3
          上涨拦截: 0.3
