版本: fundamental-score-v2
说明: 只使用实际披露日不晚于评分日的历史快照；缺失数据降低置信度，不把缺失当作高分。

维度权重:
  盈利质量: 0.30
  成长质量: 0.25
  财务健康: 0.20
  估值合理性: 0.15
  治理与事件风险: 0.10

准入阈值:
  基本面允许分数: 75
  观察分数: 65
  最低置信度: 0.60
  正式准入置信度: 0.80
  行业横截面最小样本数: 20

时效天数:
  日频价格估值: 10
  季度财务: 180
  事件风险: 90
  行业数据: 45

硬风险:
  否定意见或无法表示意见: true
  重大资金占用: true
  立案未结: true

仓位映射:
  75分以上: 1.00
  65至75分: 0.70
  55至65分: 0.40
  55分以下: 0.00

